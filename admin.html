<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Pizzaria</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login -->
<div class="login-box" id="login-box">
  <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l9 6-9 14L3 8l9-6z"/><path d="M3 8h18"/></svg>
  <h2>Painel da loja</h2>
  <p class="login-sub">Entre com sua conta de administrador</p>
  <label>E-mail</label>
  <input id="login-email" type="email" placeholder="seu@email.com">
  <label>Senha</label>
  <input id="login-senha" type="password" placeholder="••••••••">
  <button class="primary-btn" id="btn-login">Entrar</button>
  <p class="error-msg" id="login-erro" style="display:none;"></p>
  <a href="index.html" class="back-link">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar para o cardápio
  </a>
</div>

<!-- Painel -->
<div id="admin-wrap" style="display:none;">

  <header class="admin-header">
    <div class="admin-brand">
      <div class="mark">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l9 6-9 14L3 8l9-6z"/></svg>
      </div>
      <div>
        <div class="title" id="admin-nome-loja">Painel</div>
        <div class="subtitle">Área do administrador</div>
      </div>
    </div>
    <div class="admin-header-actions">
      <a href="index.html" class="btn-outline">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v11h14V9"/></svg>
        Ver a loja
      </a>
      <button class="btn-outline danger" id="btn-logout">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </button>
    </div>
  </header>

  <nav class="admin-tabs">
    <button class="active" data-tab="tab-pedidos">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 2H8l1-2z"/><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 11h6M9 15h4"/></svg>
      Pedidos
    </button>
    <button data-tab="tab-categorias">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.4L11.6 3.4A2 2 0 0010.2 2.8H4a2 2 0 00-2 2v6.2a2 2 0 00.6 1.4l9 9a2 2 0 002.8 0l6.2-6.2a2 2 0 000-2.8z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
      Categorias
    </button>
    <button data-tab="tab-produtos">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
      Produtos
    </button>
    <button data-tab="tab-entregas">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="7" width="14" height="10" rx="1"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>
      Entregas
    </button>
  </nav>

  <main class="admin-content">

    <!-- Pedidos -->
    <div class="admin-panel active" id="tab-pedidos">
      <h2>Pedidos recebidos</h2>
      <div id="lista-pedidos"></div>
    </div>

    <!-- Categorias -->
    <div class="admin-panel" id="tab-categorias">
      <h2>Categorias</h2>
      <div class="form-card">
        <label>Nome da categoria</label>
        <input id="cat-nome" placeholder="ex: Pizzas, Bebidas">
        <button class="primary-btn" id="btn-salvar-categoria">Adicionar categoria</button>
      </div>
      <div id="lista-categorias"></div>
    </div>

    <!-- Produtos -->
    <div class="admin-panel" id="tab-produtos">
      <h2>Produtos</h2>

      <div class="form-card">
        <label>Categoria</label>
        <select id="prod-categoria"></select>

        <label>Nome do produto</label>
        <input id="prod-nome" placeholder="ex: Pizza Calabresa">

        <label>Descrição</label>
        <textarea id="prod-desc" rows="2" placeholder="ex: Molho, mussarela e calabresa fatiada"></textarea>

        <label>Preço (R$)</label>
        <input id="prod-preco" type="number" step="0.01" placeholder="45.00">

        <label>URL da imagem</label>
        <input id="prod-imagem" placeholder="https://...">

        <div class="flavor-option" style="border:none;">
          <input type="checkbox" id="prod-e-pizza">
          <span>Esse produto é uma pizza (permite escolher sabores)</span>
        </div>

        <div id="prod-sabores-wrap" style="display:none;">
          <label>Sabores disponíveis</label>
          <div id="lista-sabores-form"></div>
          <button class="secondary-btn" id="btn-add-sabor" type="button">+ adicionar sabor</button>
        </div>

        <button class="primary-btn" id="btn-salvar-produto">Salvar produto</button>
        <button class="secondary-btn" id="btn-cancelar-edicao" style="display:none;margin-top:8px;">Cancelar edição</button>
      </div>

      <div id="lista-produtos"></div>
    </div>

    <!-- Entregas -->
    <div class="admin-panel" id="tab-entregas">
      <h2>Bairros e taxa de entrega</h2>
      <div class="form-card">
        <label>Nome do bairro</label>
        <input id="zona-nome" placeholder="ex: Centro">
        <label>Taxa de entrega (R$)</label>
        <input id="zona-taxa" type="number" step="0.01" placeholder="8.00">
        <button class="primary-btn" id="btn-salvar-zona">Adicionar bairro</button>
      </div>
      <div id="lista-zonas"></div>
    </div>

  </main>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
